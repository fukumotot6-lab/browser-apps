<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>マインスイーパー</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <!--
      絵の定義。画面には出さず、JSが <use href="#icon-…"> で参照する。
      絵をHTMLに置くのは、JSで文字列からSVGを組み立てずに済ませるため。
    -->
    <svg
      class="icon-definitions"
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
    >
      <symbol id="icon-mine" viewBox="0 0 16 16">
        <path
          d="M8 1v14M1 8h14M3.2 3.2l9.6 9.6M12.8 3.2l-9.6 9.6"
          fill="none"
          stroke="#000000"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <circle cx="8" cy="8" r="4.5" fill="#000000" />
        <circle cx="6.3" cy="6.3" r="1.2" fill="#ffffff" />
      </symbol>

      <symbol id="icon-flag" viewBox="0 0 16 16">
        <path d="M9 1.5 3 4.75 9 8z" fill="#e00000" />
        <path d="M9 1.5v10" fill="none" stroke="#000000" stroke-width="1.5" />
        <path d="M4 14.5h9V13h-2v-1.5H6V13H4z" fill="#000000" />
      </symbol>

      <symbol id="icon-wrong-flag" viewBox="0 0 16 16">
        <path
          d="M8 1v14M1 8h14M3.2 3.2l9.6 9.6M12.8 3.2l-9.6 9.6"
          fill="none"
          stroke="#000000"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <circle cx="8" cy="8" r="4.5" fill="#000000" />
        <path
          d="M2 2l12 12M14 2 2 14"
          fill="none"
          stroke="#e00000"
          stroke-width="2"
          stroke-linecap="round"
        />
      </symbol>

      <symbol id="icon-face-playing" viewBox="0 0 20 20">
        <circle
          cx="10"
          cy="10"
          r="9"
          fill="#ffd83a"
          stroke="#000000"
          stroke-width="1"
        />
        <circle cx="7" cy="8" r="1.3" fill="#000000" />
        <circle cx="13" cy="8" r="1.3" fill="#000000" />
        <path
          d="M6 12.5q4 3.5 8 0"
          fill="none"
          stroke="#000000"
          stroke-width="1.2"
          stroke-linecap="round"
        />
      </symbol>

      <symbol id="icon-face-won" viewBox="0 0 20 20">
        <circle
          cx="10"
          cy="10"
          r="9"
          fill="#ffd83a"
          stroke="#000000"
          stroke-width="1"
        />
        <path
          d="M5.2 8.6q1.8-2.6 3.6 0M11.2 8.6q1.8-2.6 3.6 0"
          fill="none"
          stroke="#000000"
          stroke-width="1.2"
          stroke-linecap="round"
        />
        <path
          d="M5.5 11.5h9q-4.5 6.5-9 0z"
          fill="#ffffff"
          stroke="#000000"
          stroke-width="1"
          stroke-linejoin="round"
        />
      </symbol>

      <symbol id="icon-face-lost" viewBox="0 0 20 20">
        <circle
          cx="10"
          cy="10"
          r="9"
          fill="#ffd83a"
          stroke="#000000"
          stroke-width="1"
        />
        <path
          d="M5.6 6.6l2.8 2.8M8.4 6.6 5.6 9.4M11.6 6.6l2.8 2.8M14.4 6.6l-2.8 2.8"
          fill="none"
          stroke="#000000"
          stroke-width="1.2"
          stroke-linecap="round"
        />
        <path
          d="M6 14.5q4-3.5 8 0"
          fill="none"
          stroke="#000000"
          stroke-width="1.2"
          stroke-linecap="round"
        />
      </symbol>
    </svg>

    <main class="page">
      <div id="app"></div>
      <p class="instructions">
        左クリック：開く／右クリック：旗／両クリック・中クリック：周囲を開く
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
